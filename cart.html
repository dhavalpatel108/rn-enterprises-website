<script src="app.js"></script>

                    "on-primary": "#ffffff",

                    "surface-container-highest": "#e2e2e2",

<style>

<body class="bg-surface text-on-surface min-h-screen font-body-md overflow-x-hidden">

<header class="bg-surface docked full-width top-0 border-b border-outline-variant/20 sticky z-50">
    <div class="flex justify-between items-center w-full px-8 max-w-7xl mx-auto h-20">
        <a href="index.html" class="flex items-center h-12">
            <img alt="R.N. Enterprises Logo" class="h-full w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBv1xgGNToLrnJufzVn1Ktc8kLuzqjKhdKDTKsSPzDqQgfsmXkvMqyyaoYhS02-93OUpMeAAXVhmGqnS0uM_G1uhDswbyBqMe3u77f6l1YIXMXpM4cAs-Nin1nhPrzcHk5318H5XDTfyT5l5Cqjpw_L-XrngcDABSHFnshZdBNUU3i60T4waKINcyAb2Jxu66nO7zdgttZMN4YalcrpcWOuiBEBSGhjY9Pw1Bynlmy9y7SP4UOOWwaVpTzwL3jz9bIJxmg">
        </a>
        <nav class="hidden md:flex space-x-8">
            <a class="text-on-surface hover:text-primary transition-colors py-2 px-3" href="doors.html">Doors</a>
            <a class="text-on-surface hover:text-primary transition-colors py-2 px-3" href="frames.html">Frames</a>
            <a class="text-on-surface hover:text-primary transition-colors py-2 px-3" href="hardware.html">Hardware</a>
            <a class="text-on-surface hover:text-primary transition-colors py-2 px-3" href="owner.html">Owner Login</a>
        </nav>
        <div class="flex items-center space-x-4">
            <a href="cart.html" class="hidden md:block bg-primary text-on-primary px-4 py-2 rounded font-label-md hover:opacity-90 transition-opacity flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">shopping_cart</span> Cart (<span id="cart-count">0</span>)
            </a>
        </div>
    </div>
</header>

<main class="w-full min-h-screen py-16 px-8 max-w-3xl mx-auto">
    <div class="mb-12 border-b border-outline-variant/20 pb-4">
        <h1 class="font-headline-display text-4xl text-primary mb-2">Your Cart</h1>
        <p class="text-secondary">Review your items before sending to us for a quotation.</p>
    </div>

    <div id="cart-items" class="space-y-6 mb-8">
        <!-- Items injected here -->
    </div>

    <div id="empty-state" class="hidden text-center py-12">
        <span class="material-symbols-outlined text-6xl text-secondary mb-4">remove_shopping_cart</span>
        <h2 class="text-2xl font-bold text-primary mb-2">Your cart is empty</h2>
        <a href="doors.html" class="inline-block mt-4 bg-primary text-on-primary px-6 py-2 rounded">Browse Catalog</a>
    </div>

    <div id="cart-actions" class="bg-white p-6 rounded-xl border border-outline-variant/20 shadow-sm mt-8 hidden">
        <h3 class="font-bold text-lg mb-4 text-primary">Order Summary</h3>
        <p class="text-secondary mb-6 text-sm">Submit your configuration to our team via WhatsApp for a final structural review and quotation.</p>
        
        <button onclick="shareToWhatsApp()" class="w-full bg-[#25D366] text-white px-6 py-4 rounded font-bold hover:bg-[#128C7E] transition-colors shadow flex items-center justify-center gap-2">
            <svg class="w-5 h-5 fill-current" viewbox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.347-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"></path></svg>
            Share to WhatsApp for Quotation
        </button>
        <button onclick="clearCartAndReload()" class="w-full mt-4 text-error font-bold py-2 hover:bg-error-container rounded transition">
            Clear Cart
        </button>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        renderCart();
    });

    function renderCart() {
        const cart = getCart();
        const itemsContainer = document.getElementById('cart-items');
        const emptyState = document.getElementById('empty-state');
        const actions = document.getElementById('cart-actions');
        
        itemsContainer.innerHTML = '';

        if (cart.length === 0) {
            emptyState.classList.remove('hidden');
            actions.classList.add('hidden');
        } else {
            emptyState.classList.add('hidden');
            actions.classList.remove('hidden');

            cart.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = "bg-white border border-outline-variant/20 rounded p-4 relative shadow-sm";
                
                let details = '';
                if(item.category === 'Door' || item.category === 'Frame') {
                    details = `
                        <p class="text-sm text-secondary mb-1">Size: ${item.height}mm x ${item.width}mm</p>
                        <p class="text-sm text-secondary mb-1">Design: ${item.design}</p>
                        <p class="text-sm text-secondary mb-3">Hardware: ${item.hardware}</p>
                    `;
                } else if(item.category === 'Hardware') {
                    details = `<p class="text-sm text-secondary mb-3">Price: ₹${item.price}</p>`;
                }

                el.innerHTML = `
                    <button onclick="removeItem(${index})" class="absolute top-4 right-4 text-error hover:text-error/80 p-1">
                        <span class="material-symbols-outlined text-sm">delete</span>
                    </button>
                    <div class="pr-12">
                        <h4 class="font-bold text-lg text-primary mb-1">${item.category}: ${item.type}</h4>
                        ${details}
                        <div class="flex items-center justify-between border-t border-outline-variant/10 pt-3 mt-2">
                            <span class="font-bold text-primary">Qty: ${item.qty}</span>
                            <span class="text-sm font-bold text-secondary">Req. Quotation</span>
                        </div>
                    </div>
                `;
                itemsContainer.appendChild(el);
            });
        }
    }

    function removeItem(index) {
        removeFromCart(index);
        renderCart();
    }

    function clearCartAndReload() {
        if(confirm("Are you sure you want to clear your cart?")) {
            clearCart();
            renderCart();
        }
    }

    function shareToWhatsApp() {
        const cart = getCart();
        if(cart.length === 0) return;

        let message = "*Order Inquiry - R.N. Enterprises*\\n\\n";
        cart.forEach((item, index) => {
            message += `*${index + 1}. ${item.category}: ${item.type}*\\n`;
            message += `Qty: ${item.qty}\\n`;
            if(item.category === 'Door' || item.category === 'Frame') {
                message += `Size: ${item.height}mm x ${item.width}mm\\n`;
                message += `Design: ${item.design}\\n`;
                message += `Hardware: ${item.hardware}\\n`;
            }
            message += "\\n";
        });
        message += "Please provide a quotation for the above items.";

        const url = \`https://wa.me/917972467700?text=\${encodeURIComponent(message)}\`;
        window.open(url, '_blank');
    }
</script>
</body></html>
